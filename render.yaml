services:
  - type: web
    name: pendi-demo-api
    runtime: python
    plan: free
    region: ohio
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.6
      - key: DEMO_MODE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BARO_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://ia.maua.br/api/v1
      - key: AI_API_MODEL
        value: google/gemma-3-27b
      - key: AI_ALLOWED_HOSTS
        value: ia.maua.br
      - key: AI_PROVIDER_LABEL
        value: Pendi
      - key: AI_ALLOW_HTTP
        value: "false"
      - key: ALLOW_DB_RESET
        value: "false"
